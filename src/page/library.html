<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Library</title>
    <link rel="stylesheet" href="../css/library.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1>My Music</h1>
            <ul>
                <li>Home</li>
                <li>Search</li>
                <li>Library</li>
            </ul>
        </nav>
        <aside class="sidebar">
            <h2>Playlists</h2>
            <ul>
                <li>Chill Vibes</li>
                <li>Top Hits</li>
                <li>Workout Mix</li>
                <li>Favorites</li>
            </ul>
        </aside>
        <main class="content">
            <h2>Your Library</h2>
            <div class="album-grid">
                <div class="album">
                    <img src="https://via.placeholder.com/150" alt="Album Cover">
                    <p>Album Title 1</p>
                </div>
                <div class="album">
                    <img src="https://via.placeholder.com/150" alt="Album Cover">
                    <p>Album Title 2</p>
                </div>
                <div class="album">
                    <img src="https://via.placeholder.com/150" alt="Album Cover">
                    <p>Album Title 3</p>
                </div>
                <div class="album">
                    <img src="https://via.placeholder.com/150" alt="Album Cover">
                    <p>Album Title 4</p>
                </div>
                <div class="album">
                    <img src="https://via.placeholder.com/150" alt="Album Cover">
                    <p>Album Title 5</p>
                </div>
                <div class="album">
                    <img src="https://via.placeholder.com/150" alt="Album Cover">
                    <p>Album Title 6</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
